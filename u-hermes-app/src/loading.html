<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>U-Hermes</title>
    <style>
        body {
            margin: 0;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #e0e0e0;
        }
        .container { text-align: center; }
        h1 { font-size: 2em; margin-bottom: 8px; color: #fff; }
        p { color: #a0a0a0; margin-bottom: 24px; }
        .spinner {
            width: 40px; height: 40px; margin: 0 auto;
            border: 3px solid rgba(125,211,252,0.2);
            border-top-color: #7dd3fc;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .status { margin-top: 16px; font-size: 0.85em; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <h1>U-Hermes</h1>
        <p>自进化 AI 智能体</p>
        <div class="spinner"></div>
        <div class="status">正在启动 Hermes Agent...</div>
    </div>
</body>
</html>
