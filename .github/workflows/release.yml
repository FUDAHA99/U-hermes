name: Build and Release

on:
  push:
    tags:
      - 'v*'
  # Canary: upstream is a fast-moving target, so build against its latest every
  # week. A breaking change then shows up as a failed scheduled run within days,
  # instead of surfacing months later when someone finally cuts a release.
  schedule:
    - cron: '0 2 * * 1'  # Mondays 02:00 UTC
  workflow_dispatch:
    inputs:
      canary:
        description: 'Build against upstream latest instead of the pinned versions'
        type: boolean
        default: false

env:
  # Canary runs take upstream HEAD; releases take the pins in versions.env.
  CANARY: ${{ (github.event_name == 'schedule' || inputs.canary) && 'true' || 'false' }}

permissions:
  contents: write

jobs:
  # --- Build Portable Packages ---
  portable-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Build portable package
        shell: pwsh
        run: |
          cd portable

          # Pinned toolchain versions (shared with setup.sh)
          $V = @{}
          foreach ($line in Get-Content versions.env) {
            if ($line -match '^\s*([A-Za-z_][A-Za-z0-9_]*)\s*=\s*(.+?)\s*$') { $V[$matches[1]] = $matches[2] }
          }
          Write-Host "Toolchain: Python $($V.PYTHON_EMBED_VERSION), Node $($V.NODE_VERSION), uv $($V.UV_VERSION), web-ui $($V.HERMES_WEB_UI_VERSION)"

          # Download embedded Python
          $zipName = "python-$($V.PYTHON_EMBED_VERSION)-embed-amd64.zip"
          $url = "https://www.python.org/ftp/python/$($V.PYTHON_EMBED_VERSION)/$zipName"
          Invoke-WebRequest -Uri $url -OutFile $zipName
          New-Item -ItemType Directory -Path "runtime/python-win-x64" -Force
          Expand-Archive $zipName -DestinationPath "runtime/python-win-x64" -Force
          Remove-Item $zipName
          # Enable site-packages
          $pth = Get-ChildItem "runtime/python-win-x64" -Filter "python*._pth" | Select-Object -First 1
          (Get-Content $pth.FullName) -replace '^#import site', 'import site' | Set-Content $pth.FullName

          # Download uv
          $uvZip = "uv-x86_64-pc-windows-msvc.zip"
          Invoke-WebRequest "https://github.com/astral-sh/uv/releases/download/$($V.UV_VERSION)/$uvZip" -OutFile $uvZip
          New-Item -ItemType Directory -Path "runtime/uv" -Force
          Expand-Archive $uvZip -DestinationPath "runtime/uv" -Force
          Remove-Item $uvZip
          # Fix nested dir: uv extracts with a subdirectory
          $nested = Get-ChildItem "runtime/uv" -Directory | Select-Object -First 1
          if ($nested) {
            Get-ChildItem $nested.FullName | Move-Item -Destination "runtime/uv" -Force
            Remove-Item $nested.FullName -Recurse -Force
          }

          # Download Node.js
          $nodeZip = "node-$($V.NODE_VERSION)-win-x64.zip"
          Invoke-WebRequest "https://nodejs.org/dist/$($V.NODE_VERSION)/$nodeZip" -OutFile $nodeZip
          New-Item -ItemType Directory -Path "runtime/node-win-x64" -Force
          Expand-Archive $nodeZip -DestinationPath "runtime/node-temp" -Force
          $inner = Get-ChildItem "runtime/node-temp" -Directory | Select-Object -First 1
          Copy-Item "$($inner.FullName)/*" "runtime/node-win-x64" -Recurse -Force
          Remove-Item "runtime/node-temp" -Recurse -Force
          Remove-Item $nodeZip

          # Clone Hermes Agent: the pinned release tag normally, upstream HEAD
          # on canary runs so drift is caught by a scheduled failure.
          if ($env:CANARY -eq "true") {
            Write-Host "CANARY: building against hermes-agent HEAD"
            git clone --depth 1 https://github.com/NousResearch/hermes-agent.git hermes/hermes-agent
          } else {
            git clone --depth 1 --branch $V.HERMES_AGENT_REF https://github.com/NousResearch/hermes-agent.git hermes/hermes-agent
          }
          if ($LASTEXITCODE -ne 0) { Write-Error "hermes-agent clone failed"; exit 1 }
          Write-Host "hermes-agent at $(git -C hermes/hermes-agent rev-parse --short HEAD)"

          # Apply U-Hermes tweaks (anchor-based and idempotent; exits non-zero
          # if upstream drifted, so drift fails CI instead of reaching users)
          python scripts/apply-upstream-tweaks.py hermes/hermes-agent
          if ($LASTEXITCODE -ne 0) { exit 1 }

          # Build Web UI (built-in dashboard)
          cd hermes/hermes-agent/web
          npm install
          npm run build
          cd ../../..

          # Create venv and install.
          # HERMES_NIX_BUILD=1 is upstream's escape hatch for packaging contexts:
          # since Jul 2026 their setup.py refuses to build a wheel otherwise, to
          # steer end users to the official installer. We are a packager, like the
          # Nix derivation it was written for. The resulting wheel deliberately
          # omits web_dist/locales/skills, which resolve at runtime from the source
          # checkout we ship alongside the venv.
          # Extras: `cli` was removed upstream (uv only warns); `pty` and `cron` are
          # now no-op aliases kept for clarity; `mcp` and `messaging` still matter.
          $env:HERMES_NIX_BUILD = "1"
          $pythonExe = "runtime/python-win-x64/python.exe"
          & "runtime/uv/uv.exe" venv "hermes/.venv" --python $pythonExe
          & "runtime/uv/uv.exe" pip install "hermes/hermes-agent[pty,mcp,cron,messaging]" --python "hermes/.venv/Scripts/python.exe"
          if ($LASTEXITCODE -ne 0) { Write-Error "hermes-agent install failed"; exit 1 }

          # Isolate the bundled interpreter from any Python on the user's machine.
          # Without a ._pth beside the venv's python.exe, the embedded interpreter
          # falls back to the registry and can load a same-version host install's
          # stdlib and DLLs -- which crashes with an access violation.
          $pyTag = (Get-ChildItem "runtime/python-win-x64" -Filter "python3*.dll" |
                    Where-Object { $_.Name -match '^python\d{2,}\.dll$' } |  # python313.dll, not python3.dll
                    Select-Object -First 1).BaseName
          $base = (Resolve-Path "runtime/python-win-x64").Path
          $venv = (Resolve-Path "hermes/.venv").Path
          @(
            (Join-Path $base "$pyTag.zip"), $base, (Join-Path $base "DLLs"),
            (Join-Path $venv "Lib\site-packages"), (Join-Path $venv "Scripts"), $venv, "import site"
          ) -join "`r`n" | Set-Content "hermes/.venv/Scripts/$pyTag._pth" -Encoding ascii
          Write-Host "Wrote $pyTag._pth into the venv"

          # Create portable hermes.cmd wrapper (hermes.exe breaks when drive letter changes)
          '@echo off' + "`n" + '"%~dp0python.exe" -m hermes_cli.main %*' | Set-Content "hermes/.venv/Scripts/hermes.cmd" -Encoding ascii

          # Install Hermes Web UI (npm package, pinned -- upstream ships 2-4/week)
          $NPM = "runtime\node-win-x64\npm.cmd"
          $webUiSpec = if ($env:CANARY -eq "true") { "hermes-web-ui@latest" } else { "hermes-web-ui@$($V.HERMES_WEB_UI_VERSION)" }
          & $NPM install -g $webUiSpec --prefix "runtime/node-win-x64"
          if ($LASTEXITCODE -ne 0) { Write-Error "hermes-web-ui install failed"; exit 1 }

          # Initialize data
          New-Item -ItemType Directory -Path "data/memory","data/skills","data/sessions","data/cron" -Force

          # Ship the default as config.yaml.default, NOT config.yaml. The launcher
          # copies it on first run. Shipping config.yaml itself made
          # extracting a new zip over an existing install destroy the user's
          # configuration -- and the verify step below asserted the very file
          # that made it destructive.
          @"
          model:
            provider: ""
            model: ""
          # Read by the engine: hermes_state_wal.resolve_journal_mode()
          # consults database.journal_mode before issuing any pragma.
          # On this package it is not what decides the outcome, though --
          # the bundled interpreter links a SQLite the engine's own
          # is_sqlite_wal_reset_vulnerable() flags for the WAL-reset bug, so
          # a new database is forced to DELETE regardless. This line is what
          # keeps DELETE once the bundled SQLite is new enough (3.50.7+ /
          # 3.51.3+) for that gate to stop firing. It does NOT downgrade an
          # existing WAL database; the engine refuses to do that in place.
          database:
            journal_mode: "delete"
          # Gateway API server. Upstream reads this under platforms.*, not at the
          # top level, where it was silently ignored.
          platforms:
            api_server:
              enabled: true
              extra:
                port: 8642
                host: 127.0.0.1
          skills:
            external_dirs:
              - "../skills-cn"
          memory:
            enabled: true
          cron:
            enabled: true
          "@ | Set-Content "data/config.yaml.default" -Encoding utf8

      - name: Smoke test
        shell: pwsh
        run: |
          cd portable
          $py = "hermes/.venv/Scripts/python.exe"

          Write-Host "=== [1/5] Python package imports ==="
          & $py -c "import hermes_cli.main, agent, gateway; print('imports OK')"
          if ($LASTEXITCODE -ne 0) { Write-Error "package import failed"; exit 1 }

          Write-Host "=== [2/5] CLI entry point (plugin + logging init) ==="
          # --help exits before plugin discovery, so it misses crashes in that path.
          # `profile list` loads plugins and the logging stack -- where a host-Python
          # leak showed up as an access violation that --help sailed past.
          & "hermes/.venv/Scripts/hermes.cmd" profile list
          if ($LASTEXITCODE -ne 0) { Write-Error "hermes CLI failed"; exit 1 }
          $root = (Get-Location).Path
          $paths = & $py -c "import sys; print('|'.join(p for p in sys.path if p))"
          $leak = $paths -split '\|' | Where-Object { -not $_.ToLower().StartsWith($root.ToLower()) }
          if ($leak) { Write-Error "sys.path escapes the package: $($leak -join ', ')"; exit 1 }
          Write-Host "sys.path is self-contained"

          Write-Host "=== [3/5] helper scripts compile ==="
          & $py -m py_compile scripts/config-server.py scripts/diagnose.py scripts/preflight.py scripts/wait-for.py scripts/first-login.py scripts/db-maintenance.py
          if ($LASTEXITCODE -ne 0) { Write-Error "helper script compile failed"; exit 1 }

          Write-Host "=== [4/5] config page regression tests ==="
          # Saving from the config page used to truncate config.yaml, and the
          # provider table drifted out of step with the engine's registry.
          # Both failures reached the user as a 401 or a silent chat box.
          & $py scripts/tests/test_config_merge.py
          if ($LASTEXITCODE -ne 0) { Write-Error "config merge test failed"; exit 1 }
          & $py scripts/tests/test_provider_table.py
          if ($LASTEXITCODE -ne 0) { Write-Error "provider table test failed"; exit 1 }
          & $py scripts/tests/test_first_login.py
          if ($LASTEXITCODE -ne 0) { Write-Error "first-login test failed"; exit 1 }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/tests/test_protect_config.ps1
          if ($LASTEXITCODE -ne 0) { Write-Error "protect-config test failed"; exit 1 }

          Write-Host "=== [5/5] Web UI server starts and answers HTTP ==="
          $env:PORT = "8648"
          $env:HERMES_BIN = (Resolve-Path "hermes/.venv/Scripts/hermes.exe").Path
          $node = (Resolve-Path "runtime/node-win-x64/node.exe").Path
          $server = (Resolve-Path "runtime/node-win-x64/node_modules/hermes-web-ui/dist/server/index.js").Path
          $proc = Start-Process -FilePath $node -ArgumentList "`"$server`"" -PassThru -WindowStyle Hidden
          $ok = $false
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 2
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:8648" -UseBasicParsing -TimeoutSec 5
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch {}
          }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { Write-Error "Web UI did not answer HTTP 200 on 8648 within 60s"; exit 1 }
          Write-Host "Smoke test passed."

      - name: Package
        shell: pwsh
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart('v') } else { "0.0.0-ci" }
          $zipName = "u-hermes-portable-windows-v${version}.zip"
          Compress-Archive -Path "portable/*" -DestinationPath $zipName -Force
          echo "ARTIFACT=$zipName" >> $env:GITHUB_ENV

      - name: Verify the packaged artifact
        shell: pwsh
        run: |
          # The smoke test above runs against the build directory. Anything
          # that goes wrong at packaging time -- a file that never made it
          # into the zip, an interpreter that lives outside the folder being
          # zipped -- is invisible to it. Check what the user downloads.
          $work = Join-Path $env:RUNNER_TEMP "verify-win"
          Remove-Item -Recurse -Force $work -ErrorAction SilentlyContinue
          Expand-Archive -Path $env:ARTIFACT -DestinationPath $work -Force

          $py = Join-Path $work "hermes\.venv\Scripts\python.exe"
          if (-not (Test-Path $py)) { Write-Error "the download has no Python at hermes/.venv/Scripts/python.exe"; exit 1 }
          & $py -c "import hermes_cli.main, agent, gateway; print('imports OK from the extracted download')"
          if ($LASTEXITCODE -ne 0) { Write-Error "the extracted package cannot import the engine"; exit 1 }

          # Somebody who never opens the repo has to find instructions inside
          # the zip: the repo README is not packaged and never has been.
          $guide = Get-ChildItem $work -Filter "*使用说明*" -File
          if (-not $guide) { Write-Error "no Chinese quick-start file in the zip"; exit 1 }
          Write-Host "Quick-start shipped as: $($guide.Name)"

          foreach ($needed in @(
            "Windows-Start.bat", "Windows-Menu.bat", "Config.html",
            "scripts\preflight.py", "scripts\wait-for.py", "scripts\config-server.py",
            "scripts\protect-config.ps1", "versions.env", "data\config.yaml.default"
          )) {
            if (-not (Test-Path (Join-Path $work $needed))) { Write-Error "missing from the zip: $needed"; exit 1 }
          }
          Write-Host "Packaged artifact verified."

      - name: Upload to Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: ${{ env.ARTIFACT }}
          body: |
            ## U-Hermes ${{ github.ref_name }}

            U盘自进化 AI 智能体 - 基于 Hermes Agent (Nous Research) 驱动

            ### 下载

            | 平台 | 文件 | 说明 |
            |------|------|------|
            | Windows 便携版 | `u-hermes-portable-windows-*.zip` | 解压到U盘或文件夹，运行 `Windows-Start.bat` |
            | Mac 便携版（实验性） | `u-hermes-portable-mac-*.zip` | 解压后运行 `bash Mac-Start.command`。构建校验未通过时不会附上这个文件。 |

            ### 国内加速下载（GitHub 直连慢时使用）

            - [Windows 加速下载](https://ghfast.top/https://github.com/FUDAHA99/U-hermes/releases/download/${{ github.ref_name }}/u-hermes-portable-windows-${{ github.ref_name }}.zip)

            加速链接由公共服务提供，如失效可在官方下载链接前加上 `https://ghfast.top/`。

            ### 首次使用

            你需要先有一个 AI 模型服务商的 API 密钥（DeepSeek / Kimi / 智谱 / 通义 等），
            这些服务按用量收费，没有密钥 U-Hermes 无法回答任何问题。

            1. 解压后双击 `Windows-Start.bat`
            2. 配置页面自动打开：选服务商 → 粘贴密钥 → 「测试连接」→ 「保存配置」
            3. 回到黑窗口按任意键，界面就绪后浏览器自动打开

            解压后的 `0-先看我-使用说明.txt` 里有完整说明和排错步骤。

            ### 更新日志

            查看 commit 记录了解详情。

  portable-mac:
    runs-on: macos-14  # ARM64
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Build portable package
        env:
          NODE_MIRROR: https://nodejs.org/dist
          PYPI_MIRROR: https://pypi.org/simple
        run: |
          cd portable
          # Pinned toolchain versions (same file setup.sh reads)
          . ./versions.env
          echo "Toolchain: Node $NODE_VERSION, uv $UV_VERSION, web-ui $HERMES_WEB_UI_VERSION"

          # setup.sh downloads the Node/uv runtimes and creates the venv.
          # HERMES_NIX_BUILD=1 is upstream's escape hatch for packaging contexts:
          # since Jul 2026 their setup.py refuses to build a wheel otherwise.
          export HERMES_NIX_BUILD=1
          bash setup.sh

          # Apply U-Hermes tweaks (anchor-based and idempotent; exits non-zero
          # if upstream drifted, so drift fails CI instead of reaching users)
          python3 scripts/apply-upstream-tweaks.py hermes/hermes-agent

          # Build Web UI (built-in dashboard)
          cd hermes/hermes-agent/web
          npm install
          npm run build
          cd ../../..

          # Node.js for macOS already came from setup.sh (same versions.env pin).
          # A second download here used to overlay a different version onto the
          # same directory, shipping a hybrid tree.
          test -x runtime/node-mac-arm64/bin/node || { echo "setup.sh did not install Node"; exit 1; }
          echo "Bundled Node: $(runtime/node-mac-arm64/bin/node --version)"

          # Install Hermes Web UI (npm package, pinned -- upstream ships 2-4/week)
          if [ "$CANARY" = "true" ]; then WEBUI_SPEC="hermes-web-ui@latest"; else WEBUI_SPEC="hermes-web-ui@${HERMES_WEB_UI_VERSION}"; fi
          runtime/node-mac-arm64/bin/npm install -g "$WEBUI_SPEC" --prefix runtime/node-mac-arm64

          # Initialize data
          mkdir -p data/memory data/skills data/sessions data/cron

          # Ship the default as config.yaml.default, NOT config.yaml. The launcher
          # copies it on first run. Shipping config.yaml itself made
          # extracting a new zip over an existing install destroy the user's
          # configuration -- and the verify step below asserted the very file
          # that made it destructive.
          cat > data/config.yaml.default << 'CFGEOF'
          model:
            provider: ""
            model: ""
          # Read by the engine: hermes_state_wal.resolve_journal_mode()
          # consults database.journal_mode before issuing any pragma.
          # On this package it is not what decides the outcome, though --
          # the bundled interpreter links a SQLite the engine's own
          # is_sqlite_wal_reset_vulnerable() flags for the WAL-reset bug, so
          # a new database is forced to DELETE regardless. This line is what
          # keeps DELETE once the bundled SQLite is new enough (3.50.7+ /
          # 3.51.3+) for that gate to stop firing. It does NOT downgrade an
          # existing WAL database; the engine refuses to do that in place.
          database:
            journal_mode: "delete"
          # Gateway API server. Upstream reads this under platforms.*, not at the
          # top level, where it was silently ignored.
          platforms:
            api_server:
              enabled: true
              extra:
                port: 8642
                host: 127.0.0.1
          skills:
            external_dirs:
              - "../skills-cn"
          memory:
            enabled: true
          cron:
            enabled: true
          CFGEOF

      - name: Smoke test
        run: |
          cd portable
          PY=hermes/.venv/bin/python

          echo "=== [1/5] Python package imports ==="
          "$PY" -c "import hermes_cli.main, agent, gateway; print('imports OK')"

          echo "=== [2/5] hermes CLI entry point ==="
          hermes/.venv/bin/hermes --help >/dev/null

          echo "=== [3/5] helper scripts compile ==="
          "$PY" -m py_compile scripts/config-server.py scripts/diagnose.py scripts/preflight.py scripts/wait-for.py scripts/first-login.py scripts/db-maintenance.py

          echo "=== [4/5] config page regression tests ==="
          "$PY" scripts/tests/test_config_merge.py
          "$PY" scripts/tests/test_provider_table.py
          "$PY" scripts/tests/test_first_login.py

          echo "=== [5/5] Web UI server starts and answers HTTP ==="
          SERVER=$(find runtime/node-mac-arm64 -path '*hermes-web-ui/dist/server/index.js' | head -1)
          test -n "$SERVER"
          PORT=8648 HERMES_BIN="$PWD/hermes/.venv/bin/hermes" \
            runtime/node-mac-arm64/bin/node "$SERVER" &
          SERVER_PID=$!
          ok=0
          for i in $(seq 1 30); do
            sleep 2
            if curl -fsS -o /dev/null http://127.0.0.1:8648; then ok=1; break; fi
          done
          kill $SERVER_PID 2>/dev/null || true
          if [ "$ok" != "1" ]; then echo "Web UI did not answer HTTP on 8648 within 60s"; exit 1; fi
          echo "Smoke test passed."

      - name: Package
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="0.0.0-ci"; fi
          ZIP_NAME="u-hermes-portable-mac-v${VERSION}.zip"
          # -y stores symlinks as symlinks. Without it zip silently follows
          # them, so a venv whose interpreter lives outside portable/ turned
          # into a copy of a bare binary with no stdlib behind it -- which
          # looks like a complete package right up until someone runs it.
          cd portable && zip -ryq "../${ZIP_NAME}" . -x "*.uv-cache*" "*/__pycache__/*" "*.log"
          echo "ARTIFACT=${ZIP_NAME}" >> $GITHUB_ENV

      - name: Verify the packaged artifact
        run: |
          # The smoke test above runs against the build directory, where the
          # venv can reach a Python that uv installed under the runner's home
          # directory. Whether the *download* contains a usable interpreter is
          # decided here, at packaging time, and was never checked.
          WORK="$RUNNER_TEMP/verify-mac"
          rm -rf "$WORK"; mkdir -p "$WORK"
          unzip -q "$ARTIFACT" -d "$WORK"

          PY="$WORK/hermes/.venv/bin/python"
          if [ ! -e "$PY" ]; then
            echo "FAIL: the download has no working Python at hermes/.venv/bin/python."
            echo "      The venv's interpreter is outside portable/, so it was not packaged."
            ls -l "$WORK/hermes/.venv/bin/" || true
            exit 1
          fi
          REAL=$(python3 -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' "$PY")
          case "$REAL" in
            "$WORK"/*) echo "interpreter resolves inside the package: $REAL" ;;
            *) echo "FAIL: the packaged interpreter resolves to $REAL, which is not part of the download."; exit 1 ;;
          esac

          "$PY" -c "import hermes_cli.main, agent, gateway; print('imports OK from the extracted download')"

          ls "$WORK" | grep -q "使用说明" || { echo "FAIL: no Chinese quick-start file in the zip"; exit 1; }
          for f in Mac-Start.command Config.html scripts/preflight.py scripts/wait-for.py \
                   scripts/config-server.py versions.env data/config.yaml.default; do
            test -e "$WORK/$f" || { echo "FAIL: missing from the zip: $f"; exit 1; }
          done
          echo "Packaged artifact verified."

      - name: Upload to Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.ARTIFACT }}
